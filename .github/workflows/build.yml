name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          # 1. إنشاء ملف الترخيص مسبقاً عشان Buildozer يقبله أوتوماتيك وميسألش
          mkdir -p /github/home/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /github/home/.android/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /github/home/.android/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> /github/home/.android/android-sdk-license
          
          # 2. تشغيل البناء
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
